name: onboardhub

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onboardhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - onboardhub-net

  discovery-server:
    build:
      context: ../backend/discovery-server
    ports:
      - "127.0.0.1:8771:8771"
    environment:
      SERVER_PORT: "8771"
      JAVA_OPTS: ${JAVA_OPTS:--Xmx384m -XX:+ExitOnOutOfMemoryError}
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8771/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - onboardhub-net

  auth-team-service:
    build:
      context: ../backend/auth-team-service
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      SERVER_PORT: "8091"
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: ${POSTGRES_USER:-onboardhub}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      EUREKA_URL: http://discovery-server:8771/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx384m -XX:+ExitOnOutOfMemoryError}
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8091/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - onboardhub-net

  asset-inventory-service:
    build:
      context: ../backend/asset-inventory-service
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8093:8093"
    environment:
      SERVER_PORT: "8093"
      DB_URL: jdbc:postgresql://postgres:5432/asset_db
      DB_USERNAME: ${POSTGRES_USER:-onboardhub}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      EUREKA_URL: http://discovery-server:8771/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      JAVA_OPTS: ${JAVA_OPTS:--Xmx384m -XX:+ExitOnOutOfMemoryError}
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8093/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - onboardhub-net

  employee-onboarding-service:
    build:
      context: ../backend/employee-onboarding-service
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8092:8092"
    environment:
      SERVER_PORT: "8092"
      DB_URL: jdbc:postgresql://postgres:5432/employee_db
      DB_USERNAME: ${POSTGRES_USER:-onboardhub}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      EUREKA_URL: http://discovery-server:8771/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      JAVA_OPTS: ${JAVA_OPTS:--Xmx384m -XX:+ExitOnOutOfMemoryError}
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8092/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    networks:
      - onboardhub-net

  api-gateway:
    build:
      context: ../backend/api-gateway
    depends_on:
      discovery-server:
        condition: service_healthy
      auth-team-service:
        condition: service_started
      asset-inventory-service:
        condition: service_started
      employee-onboarding-service:
        condition: service_started
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: "8090"
      EUREKA_URL: http://discovery-server:8771/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx384m -XX:+ExitOnOutOfMemoryError}
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8090/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - onboardhub-net

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8090}
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "3001:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - onboardhub-net

networks:
  onboardhub-net:
    driver: bridge

volumes:
  postgres_data:
