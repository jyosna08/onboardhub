name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run the isolated Maven test suite for each backend module.
  backend-tests:
    name: Backend tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - api-gateway
          - auth-team-service
          - asset-inventory-service
          - employee-onboarding-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/${{ matrix.service }}/pom.xml
      - name: Run Maven tests
        working-directory: backend/${{ matrix.service }}
        run: mvn -B test
      - name: Upload Surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: backend/${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  # Install, test, and build the frontend.
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # Build all six container images and publish only on pushes to main.
  docker-build:
    name: Build image (${{ matrix.name }})
    needs: [backend-tests, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: discovery-server
            context: ./backend/discovery-server
          - name: api-gateway
            context: ./backend/api-gateway
          - name: auth-team-service
            context: ./backend/auth-team-service
          - name: asset-inventory-service
            context: ./backend/asset-inventory-service
          - name: employee-onboarding-service
            context: ./backend/employee-onboarding-service
          - name: frontend
            context: ./frontend
    env:
      IMAGE_OWNER: ${{ secrets.DOCKER_USERNAME || 'onboardhub' }}
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push backend image
        if: matrix.name != 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE_OWNER }}/onboardhub-${{ matrix.name }}:latest
            ${{ env.IMAGE_OWNER }}/onboardhub-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          provenance: false
      - name: Build and push frontend image
        if: matrix.name == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ env.PUSH == 'true' }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'http://localhost:8090' }}
          tags: |
            ${{ env.IMAGE_OWNER }}/onboardhub-frontend:latest
            ${{ env.IMAGE_OWNER }}/onboardhub-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          provenance: false

  # Start the full Compose stack and exercise the public API through the gateway.
  compose-smoke:
    name: Compose integration smoke test
    needs: [docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Create local compose environment
        shell: bash
        run: |
          set -euo pipefail
          cp docker/.env.example docker/.env
          postgres_password="$(openssl rand -hex 16)"
          jwt_secret="$(openssl rand -hex 32)"
          admin_password="$(openssl rand -hex 8)"
          admin_email="admin@onboardhub.test"
          echo "::add-mask::$postgres_password"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$admin_email"
          cat > docker/.env <<EOF
          POSTGRES_USER=onboardhub
          POSTGRES_PASSWORD=$postgres_password
          JWT_SECRET=$jwt_secret
          JWT_EXPIRATION_MS=86400000
          CORS_ALLOWED_ORIGINS=http://localhost:3001
          VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'http://localhost:8090' }}
          BOOTSTRAP_ADMIN_NAME=Platform Admin
          BOOTSTRAP_ADMIN_EMAIL=$admin_email
          BOOTSTRAP_ADMIN_PASSWORD=$admin_password
          JAVA_OPTS=-Xmx384m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError
          EOF
          {
            printf 'ADMIN_EMAIL=%s\n' "$admin_email"
            printf 'ADMIN_PASSWORD=%s\n' "$admin_password"
          } >> "$GITHUB_ENV"
      - name: Start application
        run: docker compose -f docker/docker-compose.yml up -d --build
      - name: Wait for healthy containers
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            if docker compose -f docker/docker-compose.yml ps --format json | jq -s 'length > 0 and all(.[]; .Health == "healthy")' | grep -qx true; then
              echo "All compose services are healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for healthy compose services." >&2
          docker compose -f docker/docker-compose.yml ps
          while IFS= read -r service; do
            [[ -z "$service" ]] || docker compose -f docker/docker-compose.yml logs --no-color --tail 80 "$service"
          done < <(docker compose -f docker/docker-compose.yml ps --format json | jq -r 'select(.Health != "healthy") | .Service' || true)
          exit 1
      - name: Wait for Eureka registrations
        shell: bash
        run: |
          set -euo pipefail
          expected='["API-GATEWAY","ASSET-INVENTORY-SERVICE","AUTH-TEAM-SERVICE","EMPLOYEE-ONBOARDING-SERVICE"]'
          for attempt in $(seq 1 12); do
            if curl -fsS -H 'Accept: application/json' http://localhost:8771/eureka/apps |
              jq -e --argjson expected "$expected" '[.applications.application[]?.name] as $registered | all($expected[]; . as $name | $registered | index($name) != null)' >/dev/null; then
              echo "All application services registered with Eureka."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for Eureka registrations." >&2
          exit 1
      - name: Run API smoke tests
        env:
          BASE_URL: http://localhost:8090
        run: bash scripts/smoke-test.sh
      - name: Postman collection (newman)
        run: npx --yes newman run postman/OnboardHub.postman_collection.json -e postman/OnboardHub.local.postman_environment.json --env-var "baseUrl=http://localhost:8090" --env-var "adminEmail=$ADMIN_EMAIL" --env-var "adminPassword=$ADMIN_PASSWORD" --timeout-request 60000
      - name: Show compose status
        if: always()
        run: docker compose -f docker/docker-compose.yml ps
      - name: Collect compose logs on failure
        if: failure()
        shell: bash
        run: docker compose -f docker/docker-compose.yml logs --no-color > compose-logs.txt 2>&1 || true
      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop compose stack and remove volumes
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
