spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_UNIQUE
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3001}"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      routes:
        - id: auth-team-service
          uri: lb://auth-team-service
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: employee-onboarding-service
          uri: lb://employee-onboarding-service
          predicates:
            - Path=/api/employees/**,/api/onboarding/**
        - id: asset-inventory-service
          uri: lb://asset-inventory-service
          predicates:
            - Path=/api/assets/**

server:
  port: ${SERVER_PORT:8090}

eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8771/eureka/}"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
